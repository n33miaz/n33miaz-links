<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Redirecionando...</title>
  <script>
    const redirects = {
      linkedin: "https://www.linkedin.com/in/neemiasmanso/",
      instagram: "https://www.instagram.com/lele_mias/",
      wakatime: "https://wakatime.com/@n33miaz"
    };

    const githubProfileUrl = "https://github.com/n33miaz";

    window.onload = () => {
      const path = window.location.hash.replace("#", "").toLowerCase();
      const url = redirects[path];

      if (url) {
        window.open(url, "_blank");
        window.location.href = githubProfileUrl;
      } else {
        document.body.innerHTML = `<p style="color:red;">Link não encontrado. Redirecionando de volta ao perfil...</p>`;
        setTimeout(() => {
          window.location.href = githubProfileUrl;
        }, 3000);
      }
    };
  </script>
  <style>
    body { 
      background: #0d1117; 
      color: #c9d1d9; 
      display: flex; 
      justify-content: center; 
      align-items: center; 
      height: 100vh; 
      font-family: Arial, sans-serif;
    }
  </style>
</head>
<body>
  <p>Carregando...</p>
</body>
</html>
