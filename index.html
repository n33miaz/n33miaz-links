<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>N33miaz | Redirecionando...</title>
  <style>
    :root {
      --bg-color: #0d1117;
      --card-bg: rgba(22, 27, 34, 0.8);
      --text-primary: #c9d1d9;
      --text-secondary: #8b949e;
      --accent: #762075;
      --accent-glow: #76207580;
      --border: #30363d;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background-color: var(--bg-color);
      background-image: radial-gradient(circle at 50% 0%, #1f2428 0%, var(--bg-color) 70%);
      color: var(--text-primary);
      font-family: 'Segoe UI', Ubuntu, sans-serif;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
    }

    .card {
      background: var(--card-bg);
      backdrop-filter: blur(10px);
      border: 1px solid var(--border);
      padding: 2.5rem;
      border-radius: 16px;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
      text-align: center;
      max-width: 400px;
      width: 90%;
      opacity: 0;
      transform: translateY(20px);
      animation: fadeInUp 0.6s cubic-bezier(0.2, 0.8, 0.2, 1) forwards;
    }

    @keyframes fadeInUp {
      to { opacity: 1; transform: translateY(0); }
    }

    .loader {
      width: 50px;
      height: 50px;
      border: 3px solid var(--border);
      border-top: 3px solid var(--accent);
      border-radius: 50%;
      margin: 0 auto 1.5rem;
      animation: spin 1s linear infinite;
      box-shadow: 0 0 15px var(--accent-glow);
    }

    @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

    h2 { font-size: 1.5rem; margin-bottom: 0.5rem; font-weight: 600; }
    
    p { color: var(--text-secondary); font-size: 0.95rem; margin-bottom: 1.5rem; line-height: 1.5; }

    .btn {
      display: inline-block;
      padding: 0.8rem 1.5rem;
      background: var(--accent);
      color: #fff;
      text-decoration: none;
      border-radius: 6px;
      font-weight: 600;
      font-size: 0.9rem;
      transition: all 0.2s;
      border: 1px solid transparent;
      opacity: 0;
      pointer-events: none;
    }

    .btn.visible { opacity: 1; pointer-events: all; cursor: pointer; }
    .btn:hover { background: #5a1859; box-shadow: 0 0 10px var(--accent-glow); }

    .error-text { color: #ff6b6b; }
  </style>
</head>
<body>

  <div class="card">
    <div class="loader" id="spinner"></div>
    <h2 id="title">Processando...</h2>
    <p id="message">Aguarde enquanto te levamos ao destino.</p>
    <a id="manual-btn" class="btn" href="#" target="_blank">Acessar Manualmente</a>
  </div>

  <script>
    const GITHUB_PROFILE = "https://github.com/n33miaz";
    
    const redirects = {
      portfolio: { url: "https://n33miaz.github.io/", name: "Portfólio" },
      linkedin: { url: "https://www.linkedin.com/in/neemiasmanso/", name: "LinkedIn" },
      gmail: { url: "mailto:ncormino@gmail.com", name: "Email" },
      instagram: { url: "https://www.instagram.com/lele_mias/", name: "Instagram" },
      wakatime: { url: "https://wakatime.com/@n33miaz", name: "WakaTime" },
      lastfm: { url: "https://www.last.fm/user/n33miaz", name: "Last.FM" },
      readmeapi: { url: "https://gist.github.com/n33miaz/d8d22e4eb1ecee4b2531d3e7246752c0", name: "About My Github Stats API" },

      lumitcc: { url: "https://github.com/TCC-DS-2025/lumilivre-api", name: "LumiLivre Organização" },

      lumiweb: { url: "https://github.com/n33miaz/lumilivre-web", name: "LumiLivre WebSite" },
      lumiapp: { url: "https://github.com/n33miaz/lumilivre-app", name: "LumiLivre Application" },
      lumiapi: { url: "https://github.com/n33miaz/lumilivre-api", name: "LumiLivre API RestFull" }
    };

    document.addEventListener("DOMContentLoaded", () => {
      const hash = window.location.hash.replace("#", "").toLowerCase();
      const target = redirects[hash];
      
      const titleEl = document.getElementById("title");
      const msgEl = document.getElementById("message");
      const btnEl = document.getElementById("manual-btn");
      const spinnerEl = document.getElementById("spinner");

      if (target) {
        titleEl.textContent = `Indo para ${target.name}...`;
        document.title = `Redirecionando para ${target.name}`;
        btnEl.href = target.url;

        setTimeout(() => {
          try {
            const newWindow = window.open(target.url, "_blank");

            window.location.href = GITHUB_PROFILE;

            if (!newWindow || newWindow.closed || typeof newWindow.closed == 'undefined') {
              throw new Error("Popup blocked");
            }
          } catch (e) {
            spinnerEl.style.display = "none";
            titleEl.textContent = "Pop-up Bloqueado";
            msgEl.textContent = `O navegador impediu a abertura automática do ${target.name}. Clique abaixo para acessar.`;
            btnEl.classList.add("visible");  
          }
        }, 800); 
      } else {
        spinnerEl.style.borderTopColor = "#ff6b6b";
        spinnerEl.style.animation = "none";
        titleEl.textContent = "Link não encontrado";
        titleEl.classList.add("error-text");
        msgEl.textContent = "Este atalho não existe. Voltando ao perfil...";
        
        setTimeout(() => {
          window.location.href = GITHUB_PROFILE;
        }, 2500);
      }
    });
  </script>
</body>
</html>
